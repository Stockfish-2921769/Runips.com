server {
    listen 80;
    listen [::]:80;
    server_name runips.43.159.51.15.sslip.io;

    root /mnt/datadisk0/runips/frontend/current;
    index index.html;

    access_log /mnt/datadisk0/runips/logs/frontend-access.log runips_privacy;
    error_log /mnt/datadisk0/runips/logs/frontend-error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /_next/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /api/travel/v1/search {
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:18010/v1/search;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /api/travel/v1/health {
        proxy_pass http://127.0.0.1:18010/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.runips.43.159.51.15.sslip.io;

    access_log /mnt/datadisk0/runips/logs/api-access.log runips_privacy;
    error_log /mnt/datadisk0/runips/logs/api-error.log warn;

    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header Referrer-Policy "no-referrer" always;

    location ~ ^/(?:auth|rest)/v1(?:/|$) {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}
