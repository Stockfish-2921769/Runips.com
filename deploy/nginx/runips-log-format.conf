# Install in /etc/nginx/conf.d so this format is defined in the http context.
# Query strings and referrers are intentionally omitted: they are not needed
# for operations and can contain account or user-supplied identifiers.
log_format runips_privacy '$remote_addr [$time_local] '
                          '"$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent "$http_user_agent"';
